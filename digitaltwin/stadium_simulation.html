<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Digital Twin - M. Chinnaswamy Stadium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #f3f3f3;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas { display: block; }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .ui-panel {
            position: absolute;
            background: #101010cc;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 14px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            font-size: 12px;
            line-height: 1.6;
        }

        .ui-panel-title {
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 10px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-item {
            background: rgba(94, 207, 122, 0.06);
            padding: 7px;
            border-radius: 4px;
            border-left: 2px solid #5ecf7a;
        }

        .stat-label {
            font-size: 10px;
            color: #6b8a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 17px;
            font-weight: 700;
            color: #d4f0dc;
        }

        .zone-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 6px;
        }

        .zone-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 11px;
            border-bottom: 1px solid rgba(94, 207, 122, 0.08);
        }

        .zone-item:last-child { border-bottom: none; }
        .zone-label { color: #a8c4b4; }
        .zone-count { font-weight: 700; color: #5ecf7a; }

        .zone-density {
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .control-panel { top: 16px; left: 16px; width: 260px; }
        .status-panel { top: 16px; right: 16px; width: 230px; }
        .camera-panel { bottom: 16px; left: 16px; width: 260px; }

        .button-group {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 70px;
            padding: 7px 10px;
            background: rgba(94, 207, 122, 0.08);
            border: 1px solid rgba(94, 207, 122, 0.35);
            color: #5ecf7a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: Arial, Helvetica, sans-serif;
        }

        button:hover {
            background: rgba(94, 207, 122, 0.18);
            border-color: #5ecf7a;
            color: #d4f0dc;
        }

        button.active {
            background: rgba(94, 207, 122, 0.25);
            border-color: #5ecf7a;
            color: #d4f0dc;
            box-shadow: 0 0 8px rgba(94, 207, 122, 0.2);
        }

        .toggle-group { display: flex; gap: 0; margin-top: 10px; }
        .toggle-group button { border-radius: 0; flex: 1; margin: 0; }
        .toggle-group button:first-child { border-radius: 4px 0 0 4px; }
        .toggle-group button:last-child { border-radius: 0 4px 4px 0; }

        .density-indicator { margin-top: 10px; font-size: 11px; color: #6b8a7a; }

        .density-bar {
            width: 100%;
            height: 6px;
            background: rgba(94, 207, 122, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .density-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);
            width: 0%;
            transition: width 0.4s ease;
        }

        .help-text {
            font-size: 11px;
            color: #4a6a5a;
            margin-top: 10px;
            padding: 7px;
            background: rgba(94, 207, 122, 0.04);
            border-radius: 4px;
            border-left: 2px solid rgba(94, 207, 122, 0.3);
        }

        .stadium-badge {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: #101010cc;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 11px;
            color: #ffffff;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .zone-list::-webkit-scrollbar { width: 3px; }
        .zone-list::-webkit-scrollbar-track { background: rgba(20, 30, 20, 0.3); }
        .zone-list::-webkit-scrollbar-thumb { background: rgba(94, 207, 122, 0.3); border-radius: 2px; }

        /* ── Crowd-Control Panel ── */
        .crowd-panel { top: 16px; left: 290px; width: 220px; }
        .heatmap-panel { top: 255px; right: 16px; width: 320px; }
        #stadium-heatmap-canvas {
            width: 100%;
            height: 320px;
            display: block;
            border-radius: 8px;
            background: #090909;
        }

        #heatmap-status {
            font-size: 11px;
            margin-top: 8px;
            color: #a8c4b4;
            text-align: left;
        }
    </style>
</head>
<body>

<script type="importmap">
