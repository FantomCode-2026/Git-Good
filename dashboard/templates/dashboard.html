<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdGuard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b1220;
      --panel: #111827;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand span { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .conn-ok { color: var(--ok); }
    .conn-warn { color: var(--warn); }

    .twins {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .twins a {
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 0.75rem;
    }

    .twins a:hover { background: rgba(56, 189, 248, 0.08); }

    .twins-open-all {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }

    .twins-open-all:hover { background: rgba(56, 189, 248, 0.22); }

    .twin-digital-btn {
      display: inline-flex;
      align-items: center;
      font-size: 0.8125rem;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .twin-digital-btn:hover { background: rgba(56, 189, 248, 0.28); }

    #clock { font-family: var(--mono); }

    /* Page shell */
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px;
    }

    h2 {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    /* Overview */
    .overview {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: center;
    }

    @media (max-width: 560px) {
      .overview { grid-template-columns: 1fr; justify-items: start; }
    }

    .risk-gauge {
      width: 88px;
      height: 88px;
      position: relative;
      flex-shrink: 0;
    }

    .risk-gauge svg { transform: rotate(-90deg); }

    .risk-gauge-val {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .risk-gauge-num {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: var(--mono);
    }

    .risk-gauge-pct { font-size: 0.65rem; color: var(--muted); }

    .risk-level-badge {
      display: inline-block;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .risk-level-badge.LOW    { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
    .risk-level-badge.MEDIUM { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
    .risk-level-badge.HIGH   { background: rgba(239, 68, 68, 0.15); color: var(--bad); }

    .risk-action {
      font-size: 0.875rem;
      color: var(--muted);
      max-width: 52ch;
    }

    /* Metrics row */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 640px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }

    .metric {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
    }

    .metric label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .metric b {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Zones */
    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .zone-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.15);
    }

    .zone-card.HIGH { border-left: 3px solid var(--bad); }
    .zone-card.MEDIUM { border-left: 3px solid var(--warn); }
    .zone-card.LOW { border-left: 3px solid var(--ok); }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      gap: 8px;
    }

    .zone-name { font-weight: 600; font-size: 0.875rem; }
    .zone-label { font-size: 0.7rem; color: var(--muted); }
    .zone-pill {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .zone-pill.LOW { background: rgba(34, 197, 94, 0.12); color: var(--ok); }
    .zone-pill.MEDIUM { background: rgba(245, 158, 11, 0.12); color: var(--warn); }
    .zone-pill.HIGH { background: rgba(239, 68, 68, 0.12); color: var(--bad); }

    .zone-risk-bar {
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.06);
      margin-bottom: 8px;
    }

    .zone-risk-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .zone-risk-fill.LOW { background: var(--ok); }
    .zone-risk-fill.MEDIUM { background: var(--warn); }
    .zone-risk-fill.HIGH { background: var(--bad); }

    .zone-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .zone-stat-val { color: var(--text); font-family: var(--mono); font-weight: 500; }

    .zone-problem {
      margin-top: 8px;
      font-size: 0.65rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* Split: alerts + schedules */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 720px) {
      .split { grid-template-columns: 1fr; }
    }

    .alerts-feed, .active-schedules {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.8125rem;
      padding: 16px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .alert-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.12);
    }

    .alert-item.CRITICAL { border-color: rgba(239, 68, 68, 0.35); }
    .alert-item.WARNING { border-color: rgba(245, 158, 11, 0.3); }

    .alert-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.65rem;
      color: var(--muted);
    }

    .alert-sev { font-weight: 600; }
    .alert-sev.INFO { color: var(--accent); }
    .alert-sev.WARNING { color: var(--warn); }
    .alert-sev.CRITICAL { color: var(--bad); }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 0.8125rem;
    }

    .sched-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.12);
      color: var(--warn);
    }

    .sched-badge.REDIRECT { background: rgba(56, 189, 248, 0.12); color: var(--accent); }

    .sched-text { flex: 1; }
    .sched-time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }

    .action-log {
      margin-top: 12px;
      max-height: 72px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
    }

    .log-line { padding: 2px 0; border-bottom: 1px solid var(--line); }
    .log-line:last-child { border-bottom: none; }
    .log-ts { color: var(--accent); margin-right: 6px; }
    .log-high { color: var(--bad); }
    .log-med { color: var(--warn); }
    .log-low { color: var(--ok); }

    /* Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 640px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .ctrl-group { display: flex; flex-direction: column; gap: 8px; }

    .ctrl-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .ctrl-input, .ctrl-select, .ctrl-textarea {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.8125rem;
      outline: none;
    }

    .ctrl-input:focus, .ctrl-select:focus, .ctrl-textarea:focus {
      border-color: rgba(56, 189, 248, 0.45);
    }

    .ctrl-select { flex: 1; min-width: 140px; }
    .ctrl-select option { background: var(--panel); }

    .ctrl-textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      font-family: inherit;
    }

    .ctrl-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.1); }

    .ctrl-btn-primary {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.35);
      color: var(--accent);
    }

    .ctrl-btn-warn {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.35);
      color: var(--warn);
    }

    .ctrl-btn-danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: var(--bad);
    }

    #toast-container {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: min(360px, calc(100vw - 32px));
    }

    .toast {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 0.8125rem;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .toast.CRITICAL { border-color: rgba(239, 68, 68, 0.4); }
    .toast.WARNING { border-color: rgba(245, 158, 11, 0.35); }
  </style>
</head>
<body>

<header>
  <div class="brand">CrowdGuard <span>crowd monitoring</span></div>
  <div class="header-meta">
    <nav class="twins" aria-label="Digital twins">
      <a class="twin-digital-btn" href="{{ url_for('twin_files', filename='temple_simulation.html') }}" target="_blank" rel="noopener">Digital twin</a>
      <button type="button" class="twins-open-all" onclick="openAllTwins()" title="Opens three tabs">Open all</button>
      <a href="{{ url_for('twin_files', filename='temple_simulation.html') }}" target="_blank" rel="noopener">Temple</a>
      <a href="{{ url_for('twin_files', filename='stadium_simulation.html') }}" target="_blank" rel="noopener">Stadium</a>
      <a href="{{ url_for('twin_files', filename='concert_arena_simulation.html') }}" target="_blank" rel="noopener">Arena</a>
    </nav>
    <span id="clock">--:--:--</span>
    <span id="stat-connection" class="conn-ok">Live</span>
  </div>
</header>

<script type="application/json" id="cfg-twin-urls">{{ {
  "paths": [
    url_for('twin_files', filename='temple_simulation.html'),
    url_for('twin_files', filename='stadium_simulation.html'),
    url_for('twin_files', filename='concert_arena_simulation.html')
  ]
} | tojson }}</script>

<div class="wrap">

  <section class="panel">
    <h2>Overview</h2>
    <div class="overview">
      <div class="risk-gauge">
        <svg viewBox="0 0 110 110" width="88" height="88">
          <circle cx="55" cy="55" r="48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
          <circle id="gauge-arc" cx="55" cy="55" r="48" fill="none"
                  stroke="#22c55e" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="301.6" stroke-dashoffset="301.6"
                  style="transition: stroke-dashoffset 0.6s ease, stroke 0.6s ease"/>
        </svg>
        <div class="risk-gauge-val">
          <div class="risk-gauge-num" id="overall-risk-num">0</div>
          <div class="risk-gauge-pct">%</div>
        </div>
      </div>
      <div>
        <div class="risk-level-badge LOW" id="overall-severity-badge">Low risk</div>
        <p class="risk-action" id="overall-action">Loading…</p>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>At a glance</h2>
    <div class="metrics">
      <div class="metric">
        <label>Zones</label>
        <b id="stat-zones">—</b>
      </div>
      <div class="metric">
        <label>Schedules</label>
        <b id="stat-schedules">0</b>
      </div>
      <div class="metric">
        <label>Alerts</label>
        <b id="stat-alerts">0</b>
      </div>
      <div class="metric">
        <label>Updated</label>
        <b id="stat-updated" style="font-size:0.8rem;font-weight:500">—</b>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Zones</h2>
    <div class="zones-grid" id="zones-grid"></div>
  </section>

  <div class="split">
    <section class="panel">
      <h2>Alerts</h2>
      <div class="alerts-feed" id="alerts-feed">
        <div class="empty-state">No alerts yet</div>
      </div>
    </section>
    <section class="panel">
      <h2>Schedules</h2>
      <div id="schedules-list" class="active-schedules">
        <div class="empty-state">None active</div>
      </div>
      <div class="action-log" id="action-log"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Operator</h2>
    <div class="controls-grid">
      <div class="ctrl-group">
        <div class="ctrl-label">Schedule</div>
        <div class="ctrl-row">
          <select class="ctrl-select" id="ctrl-zone">
            <option value="A">Zone A — entrance</option>
            <option value="B">Zone B — north</option>
            <option value="C">Zone C — south</option>
            <option value="D">Zone D — food court</option>
          </select>
        </div>
        <div class="ctrl-row">
          <select class="ctrl-select" id="ctrl-action">
            <option value="DELAY">Delay</option>
            <option value="REDIRECT">Redirect</option>
          </select>
          <input class="ctrl-input" type="number" id="ctrl-minutes" value="10" min="1" max="120" style="width:4.5rem"/>
          <span style="color:var(--muted);font-size:0.8125rem">min</span>
          <button type="button" class="ctrl-btn ctrl-btn-warn" onclick="submitSchedule()">Apply</button>
        </div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-label">Announcement</div>
        <textarea class="ctrl-textarea" id="ctrl-msg" placeholder="Message to broadcast…"></textarea>
        <div class="ctrl-row">
          <select class="ctrl-select" id="ctrl-sev">
            <option value="INFO">Info</option>
            <option value="WARNING">Warning</option>
            <option value="CRITICAL">Critical</option>
          </select>
          <button type="button" class="ctrl-btn ctrl-btn-primary" onclick="submitAnnouncement()">Send</button>
          <button type="button" class="ctrl-btn ctrl-btn-danger" onclick="triggerHighRisk()">Test high risk</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="toast-container"></div>

<script>
let state = {};
let sseConnected = false;

function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-GB', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

function connectSSE() {
  const es = new EventSource('/stream');

  es.addEventListener('state_update', e => {
    state = JSON.parse(e.data);
    renderAll();
  });

  es.addEventListener('announcement', e => {
    showToast(JSON.parse(e.data));
  });

  es.addEventListener('ping', () => {});

  es.onopen = () => {
    sseConnected = true;
    const el = document.getElementById('stat-connection');
    el.textContent = 'Live';
    el.className = 'conn-ok';
  };

  es.onerror = () => {
    sseConnected = false;
    const el = document.getElementById('stat-connection');
    el.textContent = 'Reconnecting…';
    el.className = 'conn-warn';
    setTimeout(pollFallback, 3000);
  };
}

function pollFallback() {
  if (!sseConnected) {
    fetch('/api/state').then(r => r.json()).then(d => { state = d; renderAll(); });
    setTimeout(pollFallback, 2000);
  }
}

function renderAll() {
  if (!state) return;
  // Do not require zones — pipeline may send alerts before zone snapshots exist.
  if (!state.zones) state.zones = [];

  renderOverall();
  renderZones();
  renderAlerts();
  renderSchedules();
  renderActionLog();

  document.getElementById('stat-updated').textContent =
    new Date().toLocaleTimeString('en-GB', { hour12: false });
}

function renderOverall() {
  const risk = state.overall_risk || 0;
  const severity = state.overall_severity || 'LOW';

  const arc = document.getElementById('gauge-arc');
  const circumference = 301.6;
  arc.style.strokeDashoffset = circumference - (risk / 100) * circumference;
  arc.style.stroke = severity === 'HIGH' ? 'var(--bad)' : severity === 'MEDIUM' ? 'var(--warn)' : 'var(--ok)';

  document.getElementById('overall-risk-num').textContent = Math.round(risk);

  const badge = document.getElementById('overall-severity-badge');
  badge.className = 'risk-level-badge ' + severity;
  const labels = { LOW: 'Low risk', MEDIUM: 'Medium risk', HIGH: 'High risk' };
  badge.textContent = labels[severity] || severity;

  const worst = (state.zones || []).reduce(
    (a, b) => (b.fused_risk > a.fused_risk ? b : a),
    { fused_risk: 0, recommended_action: '' }
  );
  document.getElementById('overall-action').textContent =
    worst.recommended_action || 'Monitor all zones. No immediate action required.';

  document.getElementById('stat-zones').textContent = (state.zones || []).length;
  document.getElementById('stat-schedules').textContent = (state.active_schedules || []).length;
  document.getElementById('stat-alerts').textContent = (state.alerts || []).length;
}

function renderZones() {
  const zones = state.zones || [];
  const grid = document.getElementById('zones-grid');

  if (!zones.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No zone data</div>';
    return;
  }

  grid.innerHTML = zones.map(z => {
    const sev = z.severity || 'LOW';
    const risk = z.fused_risk || 0;
    return `
      <div class="zone-card ${sev}">
        <div class="zone-header">
          <div>
            <div class="zone-name">Zone ${z.zone}</div>
            <div class="zone-label">${z.label}</div>
          </div>
          <div class="zone-pill ${sev}">${sev}</div>
        </div>
        <div class="zone-risk-bar">
          <div class="zone-risk-fill ${sev}" style="width:${Math.min(100, risk)}%"></div>
        </div>
        <div class="zone-stats">
          <div>Risk <span class="zone-stat-val">${risk.toFixed(1)}%</span></div>
          <div>Speed <span class="zone-stat-val">${(z.avg_speed || 0).toFixed(2)}</span></div>
          <div>Density <span class="zone-stat-val">${(z.density_index || 0).toFixed(1)}</span></div>
          <div>Flow <span class="zone-stat-val">${z.flow_status || 'smooth'}</span></div>
        </div>
        <div class="zone-problem">${z.problem || 'NORMAL'}</div>
      </div>
    `;
  }).join('');
}

function renderAlerts() {
  const alerts = (state.alerts || []).slice().reverse();
  const feed = document.getElementById('alerts-feed');

  if (!alerts.length) {
    feed.innerHTML = '<div class="empty-state">No alerts yet</div>';
    return;
  }

  feed.innerHTML = alerts.slice(0, 25).map(a => `
    <div class="alert-item ${a.severity}">
      <div class="alert-meta">
        <span class="alert-sev ${a.severity}">${a.severity}</span>
        <span>${formatTs(a.timestamp)}</span>
      </div>
      <div>${escHtml(a.message)}</div>
    </div>
  `).join('');
}

function renderSchedules() {
  const schedules = state.active_schedules || [];
  const list = document.getElementById('schedules-list');

  if (!schedules.length) {
    list.innerHTML = '<div class="empty-state">None active</div>';
    return;
  }

  list.innerHTML = schedules.map(s => `
    <div class="schedule-item">
      <span class="sched-badge ${s.action}">${s.action}</span>
      <span class="sched-text">Zone ${s.zone} · ${s.minutes} min</span>
      <span class="sched-time">${formatTs(s.timestamp)}</span>
    </div>
  `).join('');
}

function renderActionLog() {
  const log = state.action_log || [];
  const el = document.getElementById('action-log');
  if (!log.length) {
    el.innerHTML = '';
    return;
  }

  el.innerHTML = log.slice().reverse().slice(0, 15).map(l => {
    const cls = l.risk > 70 ? 'log-high' : l.risk > 40 ? 'log-med' : 'log-low';
    return `<div class="log-line">
      <span class="log-ts">${formatTs(l.timestamp)}</span>
      <span class="${cls}">[${l.action}]</span> Zone ${l.zone}
      ${l.risk !== null ? ` · ${l.risk}%` : ''}
    </div>`;
  }).join('');
}

async function submitSchedule() {
  const zone = document.getElementById('ctrl-zone').value;
  const action = document.getElementById('ctrl-action').value;
  const minutes = parseInt(document.getElementById('ctrl-minutes').value, 10);

  const res = await fetch('/control/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ zone, action, minutes })
  });
  const data = await res.json();
  showToast({ message: data.message || (data.error || 'Done'), severity: data.success ? 'INFO' : 'WARNING' });
}

async function submitAnnouncement() {
  const message = document.getElementById('ctrl-msg').value.trim();
  const severity = document.getElementById('ctrl-sev').value;
  if (!message) return;

  await fetch('/control/announcement', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, severity })
  });
  document.getElementById('ctrl-msg').value = '';
}

async function triggerHighRisk() {
  await fetch('/control/announcement', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: 'Simulated high risk — Zone A: extreme compression. Immediate action required.',
      severity: 'CRITICAL'
    })
  });
  await fetch('/control/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ zone: 'A', action: 'DELAY', minutes: 15 })
  });
}

function showToast(ann) {
  const sev = ann.severity || 'INFO';
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + sev;
  const col = sev === 'CRITICAL' ? 'var(--bad)' : sev === 'WARNING' ? 'var(--warn)' : 'var(--accent)';
  el.innerHTML = `<strong style="color:${col}">${sev}</strong> — ${escHtml(ann.message || '')}`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function formatTs(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleTimeString('en-GB', { hour12: false }); }
  catch { return ts; }
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function openAllTwins() {
  const el = document.getElementById('cfg-twin-urls');
  if (!el) return;
  let paths;
  try {
    paths = JSON.parse(el.textContent).paths;
  } catch (e) {
    return;
  }
  paths.forEach((p, i) => {
    setTimeout(() => window.open(p, '_blank', 'noopener'), i * 250);
  });
}

connectSSE();
fetch('/api/state').then(r => r.json()).then(d => { state = d; renderAll(); });
</script>
</body>
</html>
